spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/skillhub
    username: ${DB_USER:skillhub}
    password: ${DB_PASSWORD:skillhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:https://keycloak.example.com/realms/skillhub}

skillhub:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:skillhub}
    presign-ttl: 10m
  api-token-prefix: skh_
  upload:
    max-uncompressed-bytes: 209715200
    max-files: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
