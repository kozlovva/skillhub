services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: skillhub
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: skillhub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./docker/keycloak/realm-skillhub.json:/opt/keycloak/data/import/realm-skillhub.json:ro
    ports:
      - "8180:8080"
  api:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: skillhub
      DB_PASSWORD: skillhub
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: skillhub
      S3_ENSURE_BUCKET: "true"
      OIDC_ISSUER: http://localhost:8180/realms/skillhub
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/skillhub/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started
  ui:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      - api
volumes:
  pgdata:
  miniodata:
